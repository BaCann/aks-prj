apiVersion: v1
kind: PersistentVolume
metadata:
  name: dashboard-5g-monitoring-pv
  namespace: free5gc
spec:
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteOnce
  hostPath:
    path: /mnt/dashboard-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: dashboard-5g-monitoring-pvc
  namespace: free5gc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi